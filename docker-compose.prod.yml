services:
  landing-page:
    build:
      context: .
      dockerfile: Dockerfile
    image: mauricio-landing-page:prod
    container_name: mauricio-landing-page-prod
    restart: always
    ports:
      - "${HOST_PORT:-80}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
