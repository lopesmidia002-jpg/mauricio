name: Build & Deploy Production Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint, Typecheck & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TypeScript check and Vite build
        run: npm run build

  docker:
    name: Build & Verify Multi-Stage Docker Container
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mauricio-landing-page:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Startup & Healthcheck
        run: |
          docker run -d --name test-landing -p 8080:80 mauricio-landing-page:latest
          sleep 5
          curl -f http://localhost:8080/ || exit 1
          curl -f http://localhost:8080/robots.txt || exit 1
          curl -f http://localhost:8080/sitemap.xml || exit 1
          docker stop test-landing
          docker rm test-landing
